<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./img/images.jpg">
    <title>Contato</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,600&family=Work+Sans:wght@400;500;600&display=swap');

:root{
    --fundo-profundo: #4a0808;
    --vermelho-marca: #dd1818;
    --vermelho-vivo: #ff0101;
    --mostarda: #c99a3f;
    --mostarda-clara: #e0b968;
    --papel: #f7f1de;
    --papel-escuro: #ece2c4;
    --solo: #2f2013;
    --madeira: #5a4632;
}

*{
    margin: 0px;
    padding: 0px;
    box-sizing: border-box;
}

body{
    max-width: 100vw;
    overflow-x: hidden;
    background-color: var(--fundo-profundo);
}

.img-responsive{
    width: clamp(24px, 4vw, 34px);
    height: clamp(24px, 4vw, 34px);
    margin-left: 2vw;
    display: block;
}

/* ===== NAVBAR ===== */
.navbar{
    width: 100%;
    height: 10vh;
    min-height: 56px;
    display: flex;
    align-items: center;
    background-color: var(--vermelho-vivo);
    box-shadow: 0px 0px 10px black;
    position: sticky;
    top: 0;
    z-index: 10;
}

.voltar{
    display: flex;
    align-items: center;
}

.voltar a{
    display: flex;
    padding: 6px;
    border-radius: 50%;
    transition: transform 0.35s ease, background-color 0.35s ease;
}

.voltar:hover a{
    transform: scale(1.2);
    background-color: rgba(255, 255, 255, 0.15);
}

.voltar a:focus-visible{
    outline: 2px solid white;
    outline-offset: 3px;
}

.navbar-marca{
    margin-left: auto;
    margin-right: 4vw;
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-style: italic;
    color: white;
    font-size: clamp(14px, 1.6vw, 20px);
    letter-spacing: 0.02em;
}

/* ===== CONTEÚDO ===== */
.conteudo{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 92vh;
    width: 100%;
    padding: 40px 4vw;
}

/* ===== CAIXA CENTRAL ===== */
.caixa{
    position: relative;
    display: flex;
    align-items: center;
    flex-direction: column;
    background-color: var(--papel);
    background-image:
        radial-gradient(circle at 12% 18%, rgba(221, 24, 24, 0.06) 0%, transparent 35%),
        radial-gradient(circle at 88% 82%, rgba(201, 154, 63, 0.08) 0%, transparent 40%);
    width: 100%;
    max-width: 760px;
    padding: 46px 6vw 44px;
    border-radius: 6px;
    text-align: center;
    font-family: "Work Sans", sans-serif;
    box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    border: 2px solid var(--madeira);
    animation: subir 0.7s ease-out both;
}

.caixa::before{
    content: "";
    position: absolute;
    top: -3px;
    left: -3px;
    right: -3px;
    height: 14px;
    background-color: var(--vermelho-marca);
    border-radius: 6px 6px 0 0;
    border: 2px solid var(--madeira);
    border-bottom: none;
}

.rotulo{
    display: inline-block;
    margin-top: 6px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: clamp(11px, 1vw, 13px);
    color: var(--vermelho-marca);
}

.caixa h1{
    margin-top: 10px;
    color: var(--solo);
    font-family: "Fraunces", serif;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(32px, 4.2vw, 52px);
    line-height: 1.1;
}

.divisor{
    width: clamp(110px, 14vw, 160px);
    height: 20px;
    color: var(--mostarda);
    margin: 16px 0 6px;
}

.subtitulo{
    max-width: 46ch;
    margin-top: 6px;
    color: var(--madeira);
    font-size: clamp(15px, 1.15vw, 18px);
    line-height: 1.6;
}

/* ===== CARDS DE CONTATO ===== */
.contato{
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    width: 100%;
    margin-top: 34px;
}

.card{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 220px;
    padding: 26px 18px 22px;
    text-decoration: none;
    background-color: var(--papel-escuro);
    border: 2px solid var(--madeira);
    border-radius: 10px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}

.card:hover,
.card:focus-visible{
    transform: translateY(-6px);
    box-shadow: 0 14px 26px rgba(0,0,0,0.3);
}

.card:focus-visible{
    outline: 2px solid var(--mostarda);
    outline-offset: 3px;
}

.icone{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    color: var(--papel);
    transition: transform 0.3s ease;
}

.icone svg{
    width: 28px;
    height: 28px;
}

.card:hover .icone{
    transform: scale(1.08) rotate(-4deg);
}

.card-insta .icone{
    background-color: var(--vermelho-marca);
}

.card-insta:hover{
    border-color: var(--vermelho-marca);
}

.card-zap .icone{
    background-color: var(--mostarda);
}

.card-zap:hover{
    border-color: var(--mostarda);
}

/* TikTok: usa o marrom-escuro (--solo) da paleta, com um traço em
   mostarda-clara no ícone, pra remeter às cores da marca sem sair do
   tom "terroso" do resto do site. */
.card-tiktok .icone{
    background-color: var(--solo);
}

.card-tiktok:hover{
    border-color: var(--solo);
}

.rede{
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-style: italic;
    font-size: 20px;
    color: var(--solo);
}

.handle{
    font-size: 14px;
    color: var(--madeira);
    letter-spacing: 0.02em;
}

@keyframes subir{
    from{
        opacity: 0;
        transform: translateY(18px);
    }
    to{
        opacity: 1;
        transform: translateY(0);
    }
}

@media (prefers-reduced-motion: reduce){
    .caixa{
        animation: none;
    }
    .voltar a,
    .card,
    .icone{
        transition: none;
    }
}

/* Tablets */
@media (max-width: 700px){
    .contato{
        gap: 18px;
    }
    .card{
        width: 44%;
        min-width: 160px;
    }
}

/* Celulares */
@media (max-width: 480px){
    .navbar{
        height: 60px;
    }
    .navbar-marca{
        margin-right: 5vw;
        font-size: 13px;
    }
    .conteudo{
        padding: 24px 5vw;
    }
    .caixa{
        padding: 36px 6vw 30px;
    }
    .caixa h1{
        font-size: 28px;
    }
    .contato{
        flex-direction: column;
        align-items: center;
    }
    .card{
        width: 100%;
        max-width: 280px;
    }
}
</style>
</head>
<body>

</body>
</html>
